    password: admin
    virtual-host: lottery-system
  ## redis ##
  data:
    redis:
      host: localhost
      port: 6379
      # 连接空闲超过 N 秒后关闭，0 为禁用，这里配置值和 tcp-keepalive 值一致
      timeout: 300s
      # 默认使用 lettuce 连接池
      lettuce:
        pool:
          # 允许最大连接数，默认 8（负值表示没有限制）
          max-active: 8
          # 最大空闲连接数，默认 8
          max-idle: 8
          # 最小空闲连接数，默认 0
          min-idle: 0
          # 连接用完时，新的请求等待时间，超过该时间抛出异常 JedisConnectionException（默认-1，负值表示没有限制）
          max-wait: 5s
##日志配置
logging:
  file:
    name: lottery_system.log # 设置日志文件名
  logback:
    rollingpolicy:
      max-file-size: 10MB # 单个日志文件最大 10MB，达到后会触发滚动
      total-size-cap: 100MB # 所有日志文件总大小上限 100MB，超出则舍弃旧日志
      max-history: 7 # 日志保留天数

