    password: admin
    virtual-host: neon-draw
  ## redis ##
  data:
    redis:
      host: localhost
      port: 6379
      # 连接空闲超过 N 秒后关闭，0 为禁用，这里配置值和 tcp-keepalive 值一致
      timeout: 300s
      # 默认使用 lettuce 连接池
      lettuce:
        pool:
          # 允许最大连接数，默认 8（负值表示没有限制）
          max-active: 8
          # 最大空闲连接数，默认 8
          max-idle: 8
          # 最小空闲连接数，默认 0
          min-idle: 0
          # 连接用完时，新的请求等待时间，超过该时间抛出异常 JedisConnectionException（默认-1，负值表示没有限制）
          max-wait: 5s
## 日志配置（配合 logback-spring.xml，prod 环境写入文件）
logging:
  file:
    path: /root/emrys/java/neon-draw/logs  # 日志根目录，自动创建 error/ 与 info/ 子目录
  level:
    root: info
    com.emrys: info

