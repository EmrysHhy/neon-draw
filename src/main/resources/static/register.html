<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>注册页面</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/base.css">
    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/jquery-validate/1.19.3/jquery.validate.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <style>
        .show-password {
            float: right;
            cursor: pointer;
            color: var(--neon-cyan);
        }
    </style>
</head>

<body class="cyber-page">
    <div class="cyber-panel cyber-panel-sm register-container">
        <h2 class="cyber-form-title">填写注册信息</h2>
        <form id="registerForm">
            <div class="form-group">
                <label for="name">姓名</label>
                <input type="text" class="form-control" id="name" name="name" placeholder="请输入姓名" required>
            </div>
            <div class="form-group">
                <label for="mail">邮箱</label>
                <input type="email" class="form-control" id="mail" name="mail" placeholder="请输入邮箱" required>
            </div>
            <div class="form-group">
                <label for="phoneNumber">手机号</label>
                <input type="text" class="form-control" id="phoneNumber" name="phoneNumber" placeholder="请输入手机号"
                    required>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">注册</button>
        </form>
    </div>

    <script>
        if (window.self === window.top) {
            document.body.classList.add('cyber-body-bg');
        }

        var params = new URLSearchParams(window.location.search);
        var admin = params.get('admin');
        // 后台 iframe 内注册用户一律视为普通用户
        var inAdminFrame = window.self !== window.top;
        var isNormalRegister = admin === 'false' || inAdminFrame;
        if (isNormalRegister) {
            $('#password').closest('div.form-group').css('display', 'none');
        }

        $("#registerForm").validate({
            rules: {
                name: "required",
                mail: {
                    required: true,
                    email: true
                },
                phoneNumber: "required",
                password: {
                    required: !isNormalRegister,
                    minlength: !isNormalRegister ? 6 : false
                }
            },
            messages: {
                name: "请输入您的姓名",
                mail: "请输入有效的邮箱地址",
                phoneNumber: "请输入您的手机号",
                password: {
                    required: "请输入密码",
                    minlength: "密码长度至少为6个字符"
                }
            },
            submitHandler: function (form) {
                var formData = {
                    name: $('#name').val(),
                    mail: $('#mail').val(),
                    phoneNumber: $('#phoneNumber').val()
                };
                if (!isNormalRegister) {
                    formData.password = $('#password').val();
                }

                $.ajax({
                    url: isNormalRegister ? '/member/register' : '/admin/register',
                    type: 'post',
                    contentType: 'application/json',
                    headers: (function () {
                        var headers = {};
                        var token = localStorage.getItem('user_token');
                        if (token) {
                            headers['user_token'] = token;
                        }
                        return headers;
                    })(),
                    data: JSON.stringify(formData),
                    success: function (result) {
                        if (result.code != 200) {
                            alert("注册失败！" + (result.message || result.msg || ''));
                            return;
                        }
                        if (isNormalRegister) {
                            alert("注册成功！");
                            form.reset();
                            if (inAdminFrame) {
                                window.parent.postMessage({
                                    from: 'user-list.html',
                                    id: '#userList'
                                }, '*');
                            }
                            return;
                        }
                        alert("注册成功！请前往登录页面登录。");
                        location.assign("blogin.html");
                    },
                    error: function (xhr) {
                        if (xhr && xhr.status === 401) {
                            alert("登录已失效，请重新登录管理员账号");
                            if (inAdminFrame) {
                                window.parent.location.href = "/blogin.html";
                            } else {
                                location.assign("blogin.html");
                            }
                            return;
                        }
                        alert("注册失败，请稍后重试");
                    }
                });
                return false;
            }
        });
    </script>
</body>

</html>
