<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>创建抽奖活动</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/toastr.min.css">
    <style>
        /* 弹窗须 fixed 覆盖 iframe 视口，避免被 body.cyber-page 子元素规则影响 */
        #prizesModal,
        #usersModal {
            position: fixed !important;
            inset: 0 !important;
            z-index: 10000 !important;
        }
        #prizesModal.is-open,
        #usersModal.is-open {
            display: flex !important;
        }
        .desc-row { margin-bottom: 60px; }
        .form-btn-box {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .form-btn-box button {
            width: 148px;
            height: 48px;
        }
        .pre-btn { margin-right: 20px; }
        #prizesContainer {
            max-height: 360px;
            margin-bottom: 24px;
            overflow-y: auto;
            padding: 0 12px;
        }
        .prize-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            justify-content: center;
        }
        .custom-p {
            font-size: 16px;
            font-weight: bold;
            margin-right: 90px;
            color: var(--text-secondary);
        }
        .prize-item input[type="checkbox"] {
            margin-right: 99px;
        }
        .prize-item label {
            margin-right: 11px;
            margin-bottom: 0;
            width: 200px;
            color: var(--text-primary);
        }
        .prize-item select { margin-left: auto; }
        .prize-item .form-control {
            width: 96px;
            height: 36px;
            line-height: 36px;
            margin-right: 56px;
        }
        .select-users-toolbar {
            margin-bottom: 12px;
        }
        .select-users-toolbar label {
            display: block;
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 6px;
        }
        .select-users-toolbar select {
            width: 100%;
        }
        .select-users-stats {
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 12px;
        }
        .select-users-stats span {
            color: var(--neon-cyan, #00f5ff);
        }
        .select-users-list-wrap {
            border: 1px solid rgba(0, 245, 255, 0.12);
            border-radius: var(--radius-md, 8px);
            background: rgba(0, 0, 0, 0.15);
            margin-bottom: 24px;
        }
        .select-users-list-header {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(0, 245, 255, 0.1);
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 600;
        }
        .select-users-list-header .col-check {
            width: 72px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-primary);
            font-weight: 500;
        }
        .select-users-list-header .col-name {
            flex: 1;
        }
        #usersContainer {
            max-height: 320px;
            overflow-y: auto;
            padding: 8px 0;
        }
        .select-users-list-wrap .user-item {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            border-bottom: 1px solid rgba(0, 245, 255, 0.06);
            margin-bottom: 0;
            justify-content: flex-start;
        }
        .select-users-list-wrap .user-item:last-child {
            border-bottom: none;
        }
        .select-users-list-wrap .user-item .col-check {
            width: 72px;
        }
        .select-users-list-wrap .user-item .col-check input[type="checkbox"] {
            margin: 0;
        }
        .select-users-list-wrap .user-item .col-name {
            flex: 1;
            color: var(--text-primary);
            margin: 0;
        }
        .user-item-empty,
        .user-item-loading {
            padding: 24px 16px;
            text-align: center;
            color: var(--text-muted, #888);
            font-size: 14px;
        }
        #usersModal .modal-content {
            max-width: 560px;
            width: 92%;
        }
    </style>
</head>
<body class="cyber-page">
<div class="cyber-panel container">
    <h2 class="cyber-form-title">创建抽奖活动</h2>
    <form id="activityForm">
        <div class="form-group">
            <label for="activityName">活动名称</label>
            <input type="text" placeholder="请输入活动名称" class="form-control" class="form-control" id="activityName" name="activityName" required>
        </div>
        <div class="form-group desc-row">
            <label for="description">活动描述</label>
            <textarea id="description" placeholder="请输入活动描述" rows="5" cols="33" class="form-control" name="description" required></textarea>
        </div>
        <div class="form-btn-box">
            <button id="buttonPrizes" type="button" class="btn btn-primary pre-btn" onclick="showPrizesModal()">圈选奖品</button>
            <button id="buttonUsers" type="button" class="btn btn-primary pre-btn" onclick="showUsersModal()">圈选人员</button>
            <button type="submit"  class="btn btn-primary" id="createActivity">创建活动</button>
        </div>
    </form>
</div>
<!-- toast提示 -->
<div class="toast"></div>
<!-- 奖品选择模态框 -->
<div id="prizesModal" class="cyber-modal">
    <div class="modal-content">
        <h2>奖品列表<span class="close"  onclick="hidePrizesModal()">&times;</span></h2>
        <div class="prize-item">
            <p class="custom-p">勾选</p>
            <p class="custom-p">奖品名</p>
            <p class="custom-p">数量</p>
            <p class="custom-p">奖品等级</p>
        </div>
        <div id="prizesContainer">
            <!-- 奖品列表将动态插入这里 -->
        </div>
        <div class="form-btn-box">
            <button type="button" class="btn btn-secondary pre-btn" onclick="hidePrizesModal()">取消</button>
            <button type="button" class="btn btn-primary" onclick="submitPrizes()">确定</button>
        </div>
    </div>
</div>
<!-- 人员选择模态框 -->
<div id="usersModal" class="cyber-modal">
    <div class="modal-content">
        <h2>人员列表<span class="close" onclick="hideUsersModal()">&times;</span></h2>
        <div class="select-users-stats">
            当前显示 <span id="visibleUserCount">0</span> 人 · 已选 <span id="selectedUserCount">0</span> 人
        </div>
        <div class="select-users-toolbar">
            <label for="groupFilterSelect">筛选范围</label>
            <select class="form-control" id="groupFilterSelect" onchange="applyGroupFilter()">
                <option value="all">所有人</option>
                <option value="none">无分组</option>
            </select>
        </div>
        <div class="select-users-list-wrap">
            <div class="select-users-list-header">
                <div class="col-check">
                    <input type="checkbox" id="selectAllUsers" onchange="toggleSelectAllVisible()">
                    <span>全选</span>
                </div>
                <div class="col-name">姓名</div>
            </div>
            <div id="usersContainer">
                <!-- 人员列表动态插入 -->
            </div>
        </div>
        <div class="form-btn-box">
            <button type="button" class="btn btn-secondary pre-btn" onclick="hideUsersModal()">取消</button>
            <button type="button" class="btn btn-primary" onclick="submitUsers()">确定</button>
        </div>
    </div>
</div>

<!-- JavaScript代码 -->
<script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script  src="https://cdn.bootcdn.net/ajax/libs/jquery-validate/1.19.3/jquery.validate.min.js"></script>
<script src="./js/toastr.min.js"></script>
<script>
    var userToken = localStorage.getItem("user_token");
    // 初始时奖品列表为空: 勾选的奖品存放
    var selectedPrizes = [];

    function setModalOpen(open) {
        var anyOpen = $('.cyber-modal.is-open').length > 0;
        document.body.classList.toggle('modal-open', open || anyOpen);
    }

    function showPrizesModal() {
        $('#prizesModal').addClass('is-open');
        setModalOpen(true);
    }

    function hidePrizesModal() {
        $('#prizesModal').removeClass('is-open');
        setModalOpen(false);
    }
    // 获取奖品列表的函数
    function fetchPrizes() {
        $.ajax({
            url: '/prize/all-list',
            type: 'GET',
            dataType: 'json',
            data: { currentPage: 1, pageSize: 100},
            headers: {
                // jwt
                "user_token": userToken
            },
            success: function(result) {
                var prizes = result.data.records;
                var prizesContainer = $('#prizesContainer');
                prizesContainer.empty(); // 清空当前奖品列表
                prizes.forEach(function(prize) {
                    prizesContainer.append(
                        $('<div class="prize-item">').append(`
                            <input type="checkbox" id="prize-${prize.prizeId}" name="prize-${prize.prizeId}" value="${prize.prizeId}">
                            <label for="prize-${prize.prizeId}">${prize.prizeName}</label>
                            <input class="form-control" type="number" name="quantity-${prize.prizeId}" min="1" value="1">
                            <select class="form-control" name="level-${prize.prizeId}">
                                <option value="FIRST_PRIZE" selected>一等奖</option>
                                <option value="SECOND_PRIZE">二等奖</option>
                                <option value="THIRD_PRIZE">三等奖</option>
                            </select>
                        `)
                    );
                });
            },
            error: function(err){
                console.log(err);
                if(err!=null && err.status==401){
                    alert("用户未登录, 即将跳转到登录页!");
                    // 跳转登录页
                    window.location.href = "/blogin.html";
                    window.parent.location.href = "/blogin.html";//让父页面一起跳转
                }
            }
        });
    }
    // 提交奖品数据的函数
    function submitPrizes() {
        selectedPrizes = [];
        // 将选中的奖品信息存储在selectedPrizes
        $('.prize-item input[type="checkbox"]:checked').each(function() {
            var prizeId = +$(this).val();
            var prizeAmount = +$('input[name="quantity-' + prizeId + '"]').val();
            var prizeTiers = $('select[name="level-' + prizeId + '"]').val();
            selectedPrizes.push({
                prizeId: prizeId,
                prizeAmount: prizeAmount,
                prizeTiers: prizeTiers
            });
        });
        // 关闭模态框
        hidePrizesModal();
        //  修改按钮
        var nextButton = document.getElementById('buttonPrizes');
        if (selectedPrizes.length > 0) {
            nextButton.textContent = '圈选奖品(已选)';
        } else {
            nextButton.textContent = '圈选奖品';
        }
    }

    // 初始时人员列表为空, 存放的勾选的人员信息
    var selectedUsers = [];
    var allUsers = [];
    var displayUsers = [];
    var allGroups = [];
    var selectedUserIds = new Set();
    var currentFilter = 'all';
    var usersModalDataLoaded = false;

    function escapeHtml(text) {
        if (text == null) {
            return '';
        }
        return String(text)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function showUsersModal() {
        selectedUserIds.clear();
        selectedUsers.forEach(function(user) {
            selectedUserIds.add(Number(user.userId));
        });
        openUsersModal();
    }

    function openUsersModal() {
        if (!usersModalDataLoaded) {
            loadUsersModalData(function() {
                $('#usersModal').addClass('is-open');
                setModalOpen(true);
            });
            return;
        }
        buildGroupFilterOptions();
        applyGroupFilter();
        $('#usersModal').addClass('is-open');
        setModalOpen(true);
    }

    function hideUsersModal() {
        $('#usersModal').removeClass('is-open');
        setModalOpen(false);
    }

    function loadUsersModalData(callback) {
        $.when(
            $.ajax({
                url: '/member/find-list',
                type: 'GET',
                headers: { "user_token": userToken }
            }),
            $.ajax({
                url: '/group/find-list',
                type: 'GET',
                headers: { "user_token": userToken }
            })
        ).done(function(userRes, groupRes) {
            var userResult = userRes[0];
            var groupResult = groupRes[0];
            if (userResult.code != 200) {
                alert('加载人员列表失败！' + (userResult.message || userResult.msg || ''));
                return;
            }
            if (groupResult.code != 200) {
                alert('加载分组列表失败！' + (groupResult.message || groupResult.msg || ''));
                return;
            }
            allUsers = userResult.data || [];
            displayUsers = allUsers.slice();
            allGroups = groupResult.data || [];
            usersModalDataLoaded = true;
            buildGroupFilterOptions();
            renderUserList();
            if (callback) {
                callback();
            }
        }).fail(function(err) {
            console.log(err);
            if (err != null && err.status == 401) {
                alert("用户未登录, 即将跳转到登录页!");
                window.location.href = "/blogin.html";
                window.parent.location.href = "/blogin.html";
            } else {
                alert('加载人员数据失败！');
            }
        });
    }

    function buildGroupFilterOptions() {
        var select = $('#groupFilterSelect');
        select.find('option:not([value="all"]):not([value="none"])').remove();
        allGroups.forEach(function(group) {
            var label = group.name || ('小组' + group.groupId);
            select.append(
                $('<option></option>').val(String(group.groupId)).text(label)
            );
        });
        if (select.find('option[value="' + currentFilter + '"]').length > 0) {
            select.val(currentFilter);
        } else {
            currentFilter = 'all';
            select.val('all');
        }
    }

    function showLoadingUsers() {
        $('#usersContainer').html('<div class="user-item-loading">加载中...</div>');
    }

    function applyGroupFilter() {
        currentFilter = String($('#groupFilterSelect').val());
        var requestData = {};
        if (currentFilter === 'none') {
            requestData.filter = 'none';
        } else if (currentFilter !== 'all') {
            requestData.groupId = currentFilter;
        }
        showLoadingUsers();
        $.ajax({
            url: '/member/find-list',
            type: 'GET',
            data: requestData,
            headers: { "user_token": userToken },
            success: function(result) {
                if (result.code != 200) {
                    alert('加载人员失败！' + (result.message || result.msg || ''));
                    return;
                }
                displayUsers = result.data || [];
                if (currentFilter === 'all') {
                    allUsers = displayUsers.slice();
                }
                renderUserList();
            },
            error: function(err) {
                console.log(err);
                if (err != null && err.status == 401) {
                    alert("用户未登录, 即将跳转到登录页!");
                    window.location.href = "/blogin.html";
                    window.parent.location.href = "/blogin.html";
                }
            }
        });
    }

    function renderUserList() {
        var users = displayUsers;
        var container = $('#usersContainer');
        container.empty();
        updateUserFilterStats();
        if (users.length === 0) {
            container.append('<div class="user-item-empty">当前范围下暂无人员</div>');
            syncSelectAllCheckbox();
            return;
        }
        users.forEach(function(user) {
            var uid = Number(user.userId);
            var checked = selectedUserIds.has(uid) ? 'checked' : '';
            container.append(
                '<div class="user-item">' +
                '<div class="col-check">' +
                '<input type="checkbox" id="activity-user-' + uid + '" value="' + uid + '" ' + checked +
                ' onchange="onUserCheckChange(' + uid + ', this.checked)">' +
                '</div>' +
                '<label class="col-name" for="activity-user-' + uid + '">' + escapeHtml(user.userName) + '</label>' +
                '</div>'
            );
        });
        syncSelectAllCheckbox();
    }

    function onUserCheckChange(userId, checked) {
        if (checked) {
            selectedUserIds.add(Number(userId));
        } else {
            selectedUserIds.delete(Number(userId));
        }
        updateUserFilterStats();
        syncSelectAllCheckbox();
    }

    function toggleSelectAllVisible() {
        var selectAll = $('#selectAllUsers').prop('checked');
        displayUsers.forEach(function(user) {
            var uid = Number(user.userId);
            if (selectAll) {
                selectedUserIds.add(uid);
            } else {
                selectedUserIds.delete(uid);
            }
        });
        renderUserList();
    }

    function syncSelectAllCheckbox() {
        var users = displayUsers;
        var selectAllEl = document.getElementById('selectAllUsers');
        if (!selectAllEl || users.length === 0) {
            if (selectAllEl) {
                selectAllEl.checked = false;
                selectAllEl.indeterminate = false;
            }
            return;
        }
        var checkedCount = users.filter(function(u) {
            return selectedUserIds.has(Number(u.userId));
        }).length;
        selectAllEl.checked = checkedCount === users.length;
        selectAllEl.indeterminate = checkedCount > 0 && checkedCount < users.length;
    }

    function updateUserFilterStats() {
        $('#visibleUserCount').text(displayUsers.length);
        $('#selectedUserCount').text(selectedUserIds.size);
    }

    function findUserNameById(userId) {
        var matched = allUsers.find(function(user) {
            return Number(user.userId) === Number(userId);
        });
        if (matched) {
            return matched.userName;
        }
        matched = displayUsers.find(function(user) {
            return Number(user.userId) === Number(userId);
        });
        return matched ? matched.userName : '';
    }

    // 提交用户数据的函数
    function submitUsers() {
        selectedUsers = Array.from(selectedUserIds).map(function(userId) {
            return {
                userId: userId,
                userName: findUserNameById(userId)
            };
        });
        hideUsersModal();
        var nextButton = document.getElementById('buttonUsers');
        if (selectedUsers.length > 0) {
            nextButton.textContent = '圈选人员(已选)';
        } else {
            nextButton.textContent = '圈选人员';
        }
    }

    // 绑定表单提交事件
    $('#createActivity').click(function(event){
        event.stopPropagation()
        $('#activityForm').validate({
            rules:{
                activityName:"required",
                description:{
                    required:true,
                }
            },
            messages:{
                activityName:"请输入活动名称",
                description:"请输入活动描述"
            },
            // 验证通过才会触发
            submitHandler:function(form){
                console.log('selectedPrizes',selectedPrizes)
                console.log('selectedUsers',selectedUsers)
                // 如果未选择奖品则进行toast提示
                if(selectedPrizes.length==0){
                    alert('请至少选择一个奖品')
                    return false
                }
                // 如果未选择人员则进行toast提示
                if(selectedUsers.length==0){
                    alert('请至少选择一个人员, 人员数量应大于等于奖品总量')
                    return false
                }
                // 获取提交表单信息
                var data = {
                    activityName:'',
                    description:'',
                    activityPrizeList:[],
                    activityUserList:[]
                }
                data.activityName = $('#activityName').val()
                data.description = $('#description').val()
                data.activityPrizeList = selectedPrizes
                data.activityUserList = selectedUsers
                submitActivity(data)
            }
        })
    })
    // 提交活动信息接口
    function submitActivity(data){
        $.ajax({
            url: '/activity/create',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(data),
            headers: {
                // jwt
                "user_token": userToken
            },
            success: function(result) {
                if (result.code != 200) {
                    alert("创建失败！" + result.msg);
                } else {
                    alert("创建成功!");
                    // 向父页面传值  https://developer.mozilla.org/zh-CN/docs/Web/API/Window/postMessage
                    window.parent.postMessage({
                        from:'activities-list.html',
                        id:'#activitiesList'
                    },'*');
                }
            },
            error:function(err){
                console.log(err);
                if(err!=null && err.status==401){
                    alert("用户未登录, 即将跳转到登录页!");
                    // 跳转登录页
                    window.location.href = "/blogin.html";
                    window.parent.location.href = "/blogin.html";//让父页面一起跳转
                }
            }
        });
    }
    // 获取奖品列表并填充模态框
    $(document).ready(function() {
        fetchPrizes();

        $('.cyber-modal').on('click', function(e) {
            if (e.target === this) {
                $(this).removeClass('is-open');
                setModalOpen(false);
            }
        });
    });
</script>
</body>
</html>
