<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>分组列表</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/base.css">
    <style>
        .group-list {
            padding: 0 30px;
        }
        #groups {
            height: calc(100vh - 134px);
            overflow-y: auto;
            padding-right: 10px;
        }
        .group-info {
            width: calc(100% - 280px);
        }
        .group-info .group-id {
            font-size: 13px;
            font-weight: 400;
            color: var(--text-muted, #888);
            margin-left: 8px;
        }
        .group-actions {
            display: flex;
            flex-direction: row;
            gap: 12px;
            min-width: 260px;
            justify-content: flex-end;
            flex-shrink: 0;
        }
        .group-actions .group-action-btn {
            min-width: 108px;
            height: 42px;
            padding: 0 16px;
            font-size: 15px;
            font-weight: 600;
            line-height: 40px;
            border-width: 1.5px;
            border-radius: var(--border-radius, 8px);
            white-space: nowrap;
        }
        .group-actions .btn-edit {
            color: var(--neon-cyan, #00f5ff);
            border-color: var(--neon-cyan, #00f5ff);
            background: rgba(0, 245, 255, 0.12);
            box-shadow: 0 0 10px rgba(0, 245, 255, 0.15);
        }
        .group-actions .btn-delete {
            color: var(--red-color, #ff3366);
            border-color: var(--red-color, #ff3366);
            background: rgba(255, 51, 102, 0.12);
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.15);
        }
        .group-actions .btn-edit:hover {
            color: var(--neon-cyan, #00f5ff);
            border-color: var(--neon-cyan, #00f5ff);
            background: rgba(0, 245, 255, 0.22);
            box-shadow: 0 0 14px rgba(0, 245, 255, 0.25);
        }
        .group-actions .btn-delete:hover {
            color: #ff6688;
            border-color: var(--red-color, #ff3366);
            background: rgba(255, 51, 102, 0.22);
            box-shadow: 0 0 14px rgba(255, 51, 102, 0.25);
        }
        .group-actions .group-action-btn:disabled {
            opacity: 1;
            cursor: not-allowed;
        }
        .group-actions .btn-edit:disabled {
            color: var(--neon-cyan, #00f5ff);
            border-color: rgba(0, 245, 255, 0.75);
            background: rgba(0, 245, 255, 0.18);
        }
        .group-actions .btn-delete:disabled {
            color: #ff6688;
            border-color: rgba(255, 51, 102, 0.75);
            background: rgba(255, 51, 102, 0.18);
        }
        .group-toolbar {
            text-align: right;
            margin-top: 16px;
            padding-right: 0;
        }
        #addGroupModal,
        #selectUsersModal {
            position: fixed !important;
            inset: 0 !important;
            z-index: 10000 !important;
        }
        #selectUsersModal {
            z-index: 10001 !important;
        }
        #addGroupModal.is-open,
        #selectUsersModal.is-open {
            display: flex !important;
        }
        .form-btn-box {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 24px;
        }
        .form-btn-box button {
            width: 148px;
            height: 48px;
        }
        .pre-btn {
            margin-right: 20px;
        }
        .add-group-form .form-group {
            margin-bottom: 16px;
        }
        .add-group-form label {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 6px;
        }
        .select-users-toolbar {
            margin-bottom: 12px;
        }
        .select-users-toolbar label {
            display: block;
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 6px;
        }
        .select-users-toolbar select {
            width: 100%;
        }
        .select-users-stats {
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 12px;
        }
        .select-users-stats span {
            color: var(--neon-cyan, #00f5ff);
        }
        .select-users-list-wrap {
            border: 1px solid rgba(0, 245, 255, 0.12);
            border-radius: var(--radius-md, 8px);
            background: rgba(0, 0, 0, 0.15);
            margin-bottom: 24px;
        }
        .select-users-list-header {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(0, 245, 255, 0.1);
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 600;
        }
        .select-users-list-header .col-check {
            width: 72px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-primary);
            font-weight: 500;
        }
        .select-users-list-header .col-name {
            flex: 1;
        }
        #selectUsersContainer {
            max-height: 320px;
            overflow-y: auto;
            padding: 8px 0;
        }
        .user-item {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            border-bottom: 1px solid rgba(0, 245, 255, 0.06);
        }
        .user-item:last-child {
            border-bottom: none;
        }
        .user-item .col-check {
            width: 72px;
        }
        .user-item .col-check input[type="checkbox"] {
            margin: 0;
        }
        .user-item .col-name {
            flex: 1;
            color: var(--text-primary);
            margin: 0;
        }
        .user-item-empty,
        .user-item-loading {
            padding: 24px 16px;
            text-align: center;
            color: var(--text-muted, #888);
            font-size: 14px;
        }
    </style>
</head>
<body class="cyber-page">
<div class="group-list">
    <h2 class="cyber-page-title">分组列表</h2>
    <div id="groups">
        <!-- 分组列表将动态插入这里 -->
    </div>
    <div class="group-toolbar">
        <button type="button" class="btn btn-primary" id="btnAddGroup" onclick="showAddGroupModal()">添加小组</button>
    </div>
</div>

<!-- 添加小组弹窗 -->
<div id="addGroupModal" class="cyber-modal">
    <div class="modal-content" style="max-width: 560px; width: 92%;">
        <h2>添加小组<span class="close" onclick="hideAddGroupModal()">&times;</span></h2>
        <div class="add-group-form">
            <div class="form-group">
                <label for="newGroupName">小组名称</label>
                <input type="text" class="form-control" id="newGroupName" placeholder="请输入小组名称">
            </div>
            <div class="form-group">
                <label for="newGroupDesc">小组描述</label>
                <textarea class="form-control" id="newGroupDesc" rows="3" placeholder="请输入小组描述（可选）"></textarea>
            </div>
        </div>
        <div class="form-btn-box">
            <button type="button" class="btn btn-secondary pre-btn" onclick="hideAddGroupModal()">取消</button>
            <button type="button" class="btn btn-primary pre-btn" id="buttonSelectUsers" onclick="showSelectUsersModal()">圈选人员</button>
            <button type="button" class="btn btn-primary" onclick="submitCreateGroup()">确定</button>
        </div>
    </div>
</div>

<!-- 圈选人员弹窗 -->
<div id="selectUsersModal" class="cyber-modal">
    <div class="modal-content" style="max-width: 560px; width: 92%;">
        <h2><span id="selectUsersModalTitle">人员列表</span><span class="close" onclick="hideSelectUsersModal()">&times;</span></h2>
        <div class="select-users-stats">
            当前显示 <span id="visibleUserCount">0</span> 人 · 已选 <span id="selectedUserCount">0</span> 人
        </div>
        <div class="select-users-toolbar">
            <label for="groupFilterSelect">筛选范围</label>
            <select class="form-control" id="groupFilterSelect" onchange="applyGroupFilter()">
                <option value="all">所有人</option>
                <option value="none">无分组</option>
            </select>
        </div>
        <div class="select-users-list-wrap">
            <div class="select-users-list-header">
                <div class="col-check">
                    <input type="checkbox" id="selectAllUsers" onchange="toggleSelectAllVisible()">
                    <span>全选</span>
                </div>
                <div class="col-name">姓名</div>
            </div>
            <div id="selectUsersContainer">
                <!-- 人员列表动态插入 -->
            </div>
        </div>
        <div class="form-btn-box">
            <button type="button" class="btn btn-secondary pre-btn" onclick="hideSelectUsersModal()">取消</button>
            <button type="button" class="btn btn-primary" onclick="submitSelectUsers()">确定</button>
        </div>
    </div>
</div>

<script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>
    var userToken = localStorage.getItem("user_token");
    var allUsers = [];
    var displayUsers = [];
    var allGroups = [];
    var groupsCache = [];
    var selectedUserIds = new Set();
    var currentFilter = 'all';
    var modalDataLoaded = false;
    // create：添加小组时圈选；edit：修改已有小组成员
    var selectUsersMode = 'create';
    var editingGroupId = null;

    function escapeHtml(text) {
        if (text == null) {
            return '';
        }
        return String(text)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function setModalOpen(open) {
        var anyOpen = $('.cyber-modal.is-open').length > 0;
        document.body.classList.toggle('modal-open', open || anyOpen);
    }

    function showAddGroupModal() {
        resetAddGroupForm();
        $('#addGroupModal').addClass('is-open');
        setModalOpen(true);
    }

    function hideAddGroupModal() {
        $('#addGroupModal').removeClass('is-open');
        hideSelectUsersModal(false);
        setModalOpen(false);
    }

    function showSelectUsersModal() {
        selectUsersMode = 'create';
        editingGroupId = null;
        currentFilter = 'all';
        openSelectUsersModal();
    }

    function openEditMembers(groupId) {
        var group = groupsCache.find(function(g) {
            return Number(g.groupId) === Number(groupId);
        });
        if (!group) {
            alert('未找到该小组');
            return;
        }
        selectUsersMode = 'edit';
        editingGroupId = Number(groupId);
        selectedUserIds.clear();
        (group.userIds || []).forEach(function(uid) {
            selectedUserIds.add(Number(uid));
        });
        currentFilter = String(groupId);
        updateFilterStats();
        openSelectUsersModal();
    }

    function openSelectUsersModal() {
        updateSelectUsersModalTitle();
        // 每次打开弹窗同步最新分组及成员数据
        if (groupsCache.length > 0) {
            allGroups = groupsCache.slice();
        }
        if (!modalDataLoaded) {
            loadModalData(function() {
                $('#selectUsersModal').addClass('is-open');
                setModalOpen(true);
            });
            return;
        }
        buildGroupFilterOptions();
        applyGroupFilter();
        $('#selectUsersModal').addClass('is-open');
        setModalOpen(true);
    }

    function updateSelectUsersModalTitle() {
        var title = selectUsersMode === 'edit' ? '修改组员' : '人员列表';
        $('#selectUsersModalTitle').text(title);
    }

    function hideSelectUsersModal(updateOpenState) {
        $('#selectUsersModal').removeClass('is-open');
        if (updateOpenState !== false) {
            setModalOpen($('#addGroupModal').hasClass('is-open'));
        }
    }

    function submitSelectUsers() {
        if (selectUsersMode === 'edit') {
            submitRenewMembers();
            return;
        }
        hideSelectUsersModal();
        updateSelectUsersButtonText();
    }

    function submitRenewMembers() {
        var userIds = Array.from(selectedUserIds);
        $.ajax({
            url: '/group/renew-members',
            type: 'POST',
            contentType: 'application/json',
            headers: { "user_token": userToken },
            data: JSON.stringify({
                groupId: editingGroupId,
                userIds: userIds
            }),
            success: function(result) {
                if (result.code != 200) {
                    alert('修改组员失败！' + (result.message || ''));
                    return;
                }
                hideSelectUsersModal();
                modalDataLoaded = false;
                fetchGroupList();
            },
            error: function(xhr) {
                handleApiError(xhr, '修改组员失败！');
            }
        });
    }

    function updateSelectUsersButtonText() {
        var btn = document.getElementById('buttonSelectUsers');
        if (selectedUserIds.size > 0) {
            btn.textContent = '圈选人员(已选)';
        } else {
            btn.textContent = '圈选人员';
        }
    }

    function resetAddGroupForm() {
        $('#newGroupName').val('');
        $('#newGroupDesc').val('');
        selectedUserIds.clear();
        currentFilter = 'all';
        selectUsersMode = 'create';
        editingGroupId = null;
        $('#groupFilterSelect').val('all');
        updateFilterStats();
        updateSelectUsersButtonText();
    }

    function loadModalData(callback) {
        $.when(
            $.ajax({
                url: '/member/find-list',
                type: 'GET',
                headers: { "user_token": userToken }
            }),
            $.ajax({
                url: '/group/find-list',
                type: 'GET',
                headers: { "user_token": userToken }
            })
        ).done(function(userRes, groupRes) {
            var userResult = userRes[0];
            var groupResult = groupRes[0];
            if (userResult.code != 200) {
                alert("加载人员列表失败！" + (userResult.message || ''));
                return;
            }
            if (groupResult.code != 200) {
                alert("加载分组列表失败！" + (groupResult.message || ''));
                return;
            }
            allUsers = userResult.data || [];
            displayUsers = allUsers.slice();
            allGroups = groupResult.data || [];
            groupsCache = allGroups.slice();
            modalDataLoaded = true;
            buildGroupFilterOptions();
            if (currentFilter === 'all') {
                renderUserList();
            } else {
                applyGroupFilter();
            }
            if (callback) {
                callback();
            }
        }).fail(function(xhr) {
            handleApiError(xhr, '加载数据失败！');
        });
    }

    function buildGroupFilterOptions() {
        var select = $('#groupFilterSelect');
        select.find('option:not([value="all"]):not([value="none"])').remove();
        allGroups.forEach(function(group) {
            var label = group.name || ('小组' + group.groupId);
            select.append(
                $('<option></option>').val(String(group.groupId)).text(label)
            );
        });
        if (select.find('option[value="' + currentFilter + '"]').length > 0) {
            select.val(currentFilter);
        } else {
            currentFilter = 'all';
            select.val('all');
        }
    }

    function showLoadingUsers() {
        $('#selectUsersContainer').html('<div class="user-item-loading">加载中...</div>');
    }

    function applyGroupFilter() {
        currentFilter = String($('#groupFilterSelect').val());
        var requestData = {};
        if (currentFilter === 'none') {
            requestData.filter = 'none';
        } else if (currentFilter !== 'all') {
            requestData.groupId = currentFilter;
        }
        showLoadingUsers();
        $.ajax({
            url: '/member/find-list',
            type: 'GET',
            data: requestData,
            headers: { "user_token": userToken },
            success: function(result) {
                if (result.code != 200) {
                    alert('加载人员失败！' + (result.message || ''));
                    return;
                }
                displayUsers = result.data || [];
                if (currentFilter === 'all') {
                    allUsers = displayUsers.slice();
                }
                renderUserList();
            },
            error: function(xhr) {
                handleApiError(xhr, '加载人员失败！');
            }
        });
    }

    function renderUserList() {
        var users = displayUsers;
        var container = $('#selectUsersContainer');
        container.empty();
        updateFilterStats();
        if (users.length === 0) {
            container.append('<div class="user-item-empty">当前范围下暂无人员</div>');
            syncSelectAllCheckbox();
            return;
        }
        users.forEach(function(user) {
            var uid = Number(user.userId);
            var checked = selectedUserIds.has(uid) ? 'checked' : '';
            container.append(
                '<div class="user-item">' +
                '<div class="col-check">' +
                '<input type="checkbox" id="add-user-' + uid + '" value="' + uid + '" ' + checked +
                ' onchange="onUserCheckChange(' + uid + ', this.checked)">' +
                '</div>' +
                '<label class="col-name" for="add-user-' + uid + '">' + escapeHtml(user.userName) + '</label>' +
                '</div>'
            );
        });
        syncSelectAllCheckbox();
    }

    function onUserCheckChange(userId, checked) {
        if (checked) {
            selectedUserIds.add(Number(userId));
        } else {
            selectedUserIds.delete(Number(userId));
        }
        updateFilterStats();
        syncSelectAllCheckbox();
    }

    function toggleSelectAllVisible() {
        var selectAll = $('#selectAllUsers').prop('checked');
        displayUsers.forEach(function(user) {
            var uid = Number(user.userId);
            if (selectAll) {
                selectedUserIds.add(uid);
            } else {
                selectedUserIds.delete(uid);
            }
        });
        renderUserList();
    }

    function syncSelectAllCheckbox() {
        var users = displayUsers;
        var selectAllEl = document.getElementById('selectAllUsers');
        if (!selectAllEl || users.length === 0) {
            if (selectAllEl) {
                selectAllEl.checked = false;
                selectAllEl.indeterminate = false;
            }
            return;
        }
        var checkedCount = users.filter(function(u) {
            return selectedUserIds.has(Number(u.userId));
        }).length;
        selectAllEl.checked = checkedCount === users.length;
        selectAllEl.indeterminate = checkedCount > 0 && checkedCount < users.length;
    }

    function updateFilterStats() {
        $('#visibleUserCount').text(displayUsers.length);
        $('#selectedUserCount').text(selectedUserIds.size);
    }

    function submitCreateGroup() {
        var name = $('#newGroupName').val().trim();
        if (!name) {
            alert('请输入小组名称');
            return;
        }
        var description = $('#newGroupDesc').val().trim();
        var userIds = Array.from(selectedUserIds);
        $.ajax({
            url: '/group/create',
            type: 'POST',
            contentType: 'application/json',
            headers: { "user_token": userToken },
            data: JSON.stringify({
                name: name,
                description: description || null,
                userIds: userIds
            }),
            success: function(result) {
                if (result.code != 200) {
                    alert('创建小组失败！' + (result.message || ''));
                    return;
                }
                hideAddGroupModal();
                resetAddGroupForm();
                modalDataLoaded = false;
                fetchGroupList();
            },
            error: function(xhr) {
                handleApiError(xhr, '创建小组失败！');
            }
        });
    }

    function handleApiError(xhr, prefix) {
        console.log(xhr);
        if (xhr != null && xhr.status == 401) {
            alert("用户未登录, 即将跳转到登录页!");
            window.parent.location.href = "/blogin.html";
            return;
        }
        var msg = prefix;
        if (xhr.responseJSON && xhr.responseJSON.message) {
            msg += xhr.responseJSON.message;
        }
        alert(msg);
    }

    function deleteGroup(groupId) {
        var group = groupsCache.find(function(g) {
            return Number(g.groupId) === Number(groupId);
        });
        var groupName = group ? group.name : '该小组';
        if (!confirm('确定删除小组「' + groupName + '」吗？删除后不可恢复。')) {
            return;
        }
        $.ajax({
            url: '/group/delete',
            type: 'POST',
            data: { groupId: groupId },
            headers: { "user_token": userToken },
            success: function(result) {
                if (result.code != 200) {
                    alert('删除小组失败！' + (result.message || ''));
                    return;
                }
                modalDataLoaded = false;
                fetchGroupList();
            },
            error: function(xhr) {
                handleApiError(xhr, '删除小组失败！');
            }
        });
    }

    function fetchGroupList() {
        $.ajax({
            url: '/group/find-list',
            type: 'GET',
            headers: {
                "user_token": userToken
            },
            success: function(result) {
                if (result.code != 200) {
                    alert("查询分组列表失败！" + (result.message || result.msg || ''));
                    return;
                }
                var groups = result.data || [];
                groupsCache = groups;
                var listContainer = document.getElementById('groups');
                listContainer.innerHTML = '';
                if (groups.length === 0) {
                    listContainer.innerHTML = '<div class="cyber-list-item"><div class="group-info"><p>暂无分组数据</p></div></div>';
                    return;
                }
                var groupsHtml = '';
                groups.forEach(function(group) {
                    var description = group.description ? escapeHtml(group.description) : '';
                    groupsHtml += `
                        <div class="cyber-list-item group-item">
                            <div class="group-info">
                                <h4>${escapeHtml(group.name)}<span class="group-id">#${escapeHtml(group.groupId)}</span></h4>
                                <p>${description}</p>
                            </div>
                            <div class="group-actions">
                                <button type="button" class="btn group-action-btn btn-edit" onclick="openEditMembers(${group.groupId})">修改组员</button>
                                <button type="button" class="btn group-action-btn btn-delete" onclick="deleteGroup(${group.groupId})">删除</button>
                            </div>
                        </div>
                    `;
                });
                $('#groups').html(groupsHtml);
            },
            error: function(xhr) {
                handleApiError(xhr, '查询分组列表失败！');
            }
        });
    }

    $(document).ready(function() {
        fetchGroupList();
    });
</script>
</body>
</html>
