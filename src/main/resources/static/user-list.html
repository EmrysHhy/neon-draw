<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>人员列表</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/base.css">
    <style>
        .user-table th:first-child, .user-table td:first-child,
        .user-table th:nth-child(3), .user-table td:nth-child(3) {
            width: 15%;
        }
        .user-table th:nth-child(2), .user-table td:nth-child(2) {
            width: 25%;
        }
        .user-table td {
            height: 50px;
        }
    </style>
</head>
<body class="cyber-page">
<div class="cyber-table-wrap user-table">
    <h2 class="cyber-page-title">人员列表</h2>
    <div class="cyber-table-box table-box">
        <table class="table">
            <thead>
            <tr>
                <th>人员id</th>
                <th>姓名</th>
                <th>身份</th>
            </tr>
            </thead>
            <tbody id="userList">
            </tbody>
        </table>
    </div>
</div>


<script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>
    var userToken = localStorage.getItem("user_token");

    function fetchUserData() {
        $.ajax({
            url: '/user/base-user/find-list',
            type: 'GET',
            headers: {
                "user_token": userToken
            },
            success: function(result) {
                if (result.code != 200) {
                    alert("查询用户列表失败！" + result.msg);
                } else {
                    var users = result.data;
                    var userList = $('#userList');
                    userList.empty();
                    users.forEach(function(user) {
                        userList.append('<tr> ' +
                        '<td>' + user.userId + '</td>' +
                        '<td>' + user.userName + '</td>' +
                        '<td>' + user.identity + '</td>' +
                        '</tr>');
                    });
                }
            },
            error: function(err){
                console.log(err);
                if(err!=null && err.status==401){
                    alert("用户未登录, 即将跳转到登录页!");
                    window.parent.location.href = "/blogin.html";
                }
            }
        });
    }

    $(document).ready(function() {
        fetchUserData();
    });

</script>
</body>
</html>
