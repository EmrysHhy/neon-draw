<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>创建奖品</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/base.css">
    <style>
        .prize-row { margin-bottom: 10px; }
        .btn {
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 140px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }
    </style>
</head>
<body class="cyber-page">
<div class="cyber-panel container">
    <h2 class="cyber-form-title">开始创建奖品</h2>
    <div id="prizeRows">
        <div class="prize-row">
            <div class="form-group">
                <label for="prizeName">奖品名称</label>
                <input class="form-control" type="text" placeholder="请输入奖品名称" id="prizeName" name="prizeName" class="prize-name" required>
            </div>
            <div class="form-group">
                <label for="prizeName">奖品图片</label>
                <div class="img-upload">
                    <!-- 上传图片的框 -->
                    <div class="cyber-upload-box upload-box">
                        <span class="plus">+</span>
                        <span class="up-txt">上传图片</span>
                        <!-- 预览图 -->
                        <img src="./pic/bg.png" class="preview-img" id="previewImg" alt="" srcset="">
                        <input class="form-control" type="file" onchange="showImg()" id="prizeImageUrl" >
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label for="price">奖品价格</label>
                <input class="form-control" placeholder="请输入奖品价格" type="number" id="price" name="price" class="prize-price" required>
            </div>
            <div class="form-group">
                <label for="description">奖品描述</label>
                <textarea class="form-control" id="description" placeholder="请输入奖品描述"  name="description" class="prize-description" required></textarea>
            </div>
        </div>
    </div>
    <button type="submit" class="btn btn-primary" onclick="submitPrizes()">创建奖品</button>
</div>

<script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>
    var userToken = localStorage.getItem("user_token");
    var selectedFile = null;

    function resetForm() {
        $('#prizeName').val('');
        $('#description').val('');
        $('#price').val('');
        $('#prizeImageUrl').val('');
        $('#previewImg').hide().attr('src', './pic/bg.png');
        selectedFile = null;
    }

    // 提交奖品数据的函数
    function submitPrizes() {
        var prizeName = $('#prizeName').val();
        var description = $('#description').val();
        var price = $('#price').val();
        var formData = new FormData();
        formData.append("param", JSON.stringify({
            prizeName: prizeName,
            description: description,
            price: price,
        }));
        if (selectedFile) {
            formData.append("prizePic", selectedFile);
        }
        // 发送POST请求到后端接口
        $.ajax({
            url: '/prize/create',
            type: 'POST',
            // 不设置Content-Type请求头，因为数据将通过其他方式传递，例如通过FormData。
            contentType : false,
            // 不要处理发送的数据
            processData : false,
            headers: {
                // jwt
                "user_token" : userToken
            },
            data: formData,
            success: function(result) {
                if(result.code == 200) {
                    alert('奖品创建成功！');
                    resetForm();
                } else {
                    alert('创建奖品失败：' + result.message);
                }
            },
            error:function(err){
                console.log(err);
                if(err!=null && err.status==401){
                    alert("用户未登录, 即将跳转到登录页!");
                    // 跳转登录页
                    window.location.href = "/blogin.html";
                    window.parent.location.href = "/blogin.html";//让父页面一起跳转
                }
            }
        });
    }
    // 上传图片：读取用户通过文件输入选择的图片文件，并将其显示在一个网页元素中
    function showImg(){
        var file = document.getElementById("prizeImageUrl").files[0];
        if (!file) {
            return;
        }
        selectedFile = file;
        var r= new FileReader();
        result = r.readAsDataURL(file);
        r.onload=function (e) {
            console.log(e)
            $('#previewImg').attr("src", e.target.result).show();
        }
    }

</script>
</body>
</html>
