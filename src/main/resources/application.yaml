spring:
  application:
    name: lottery-system
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  ## 邮件配置 ##
  mail:
    host: smtp.163.com                                              # SMTP服务器地址
    port: 465                                                       # SMTP端口，465为SSL加密端口
    username: m15360167286@163.com                                  # 发件人邮箱
    password: CDSgJKfssQxwb7bJ                                      # SMTP授权码（非邮箱登录密码）
    default-encoding: UTF-8                                         # 邮件默认编码
    properties:                                                     # 额外属性配置
      mail:
        smtp:
          ssl:
            enable: true                                            # 启用SSL加密传输
          auth: true                                                # 启用SMTP认证
          connectiontimeout: 5000                                   # 连接超时时间（毫秒）
          timeout: 5000                                             # 读取超时时间（毫秒）
          writetimeout: 5000                                        # 写入超时时间（毫秒）
  web:
    resources:
      static-locations: classpath:/static/,file:${pic.local-path}

  ## 文件上传 ##
  servlet:
    multipart:
      max-file-size: 10MB       # 单个文件最大大小，超过则抛出 MaxUploadSizeExceededException
      max-request-size: 20MB    # 整个 multipart 请求的总大小上限（含所有文件+表单字段）
  ## mq ##
  rabbitmq:
    listener:
      simple:
        acknowledge-mode: auto  # 消息确认机制，默认 auto
        retry:
          enabled: true         # 开启失败重试
          max-attempts: 5       # 最多重试 5 次

## 图片上传 ##
pic:
  max-edge: 800   # 奖品图最长边像素，超过则等比例缩小后保存

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true  # 将数据库中的下划线命名转换为驼峰命名
  type-handlers-package: com.emrys.lotterysystem.dao.handle  # 指定自定义类型处理器的包路径

logging:
  config: classpath:logback-spring.xml

## 异步线程池（配合 ExecutorConfig 使用，Bean 名称：asyncServiceExecutor） ##
async:
  executor:
    thread:
      core_pool_size: 5        # 核心线程数
      max_pool_size: 10        # 最大线程数
      queue_capacity: 100      # 任务队列容量
      name:
        prefix: lottery-async- # 线程名前缀，便于日志排查

