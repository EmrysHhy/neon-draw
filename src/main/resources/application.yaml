spring:
  application:
    name: lottery-system
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true  # 将数据库中的下划线命名转换为驼峰命名
  type-handlers-package: com.emrys.lotterysystem.dao.handle  # 指定自定义类型处理器的包路径
logging:
  config: classpath:logback-spring.xml
