spring:
  output:
    ansi:
      enabled: always  # Windows / IDE 终端强制启用 ANSI 彩色
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/neon_draw?characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 247711
  rabbitmq:
    host: 115.28.210.98
    port: 5672
    username: admin
    password: admin
    virtual-host: lottery-system
  ## redis ##
  data:
    redis:
      host: localhost
      port: 8888
      # 连接空闲超过 N 秒后关闭，0 为禁用，这里配置值和 tcp-keepalive 值一致
      timeout: 300s
      # 默认使用 lettuce 连接池
      lettuce:
        pool:
          # 允许最大连接数，默认 8（负值表示没有限制）
          max-active: 8
          # 最大空闲连接数，默认 8
          max-idle: 8
          # 最小空闲连接数，默认 0
          min-idle: 0
          # 连接用完时，新的请求等待时间，超过该时间抛出异常 JedisConnectionException（默认-1，负值表示没有限制）
          max-wait: 5s

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 开启 MyBatis 的 SQL 日志打印，将执行的 SQL 语句和参数输出到控制台
logging:
  level:
    com.emrys: debug
# 自定义上传路径（末尾 / 不可省略）
pic:
  local-path: D:/code/JAVA/project/lottery-system/upload/